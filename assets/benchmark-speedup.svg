<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" role="img" aria-labelledby="title desc">
  <title id="title">Triton MaxSim speedup over PyTorch on an NVIDIA L4</title>
  <desc id="desc">Horizontal bars show mean-latency speedups for six shapes in FP16 and BF16. Triton is faster in all twelve cases, ranging from 1.57 to 4.31 times.</desc>
  <rect width="860" height="510" rx="16" fill="#0d1117"/>
  <text x="36" y="43" fill="#f0f6fc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">Triton MaxSim speedup vs. PyTorch</text>
  <text x="36" y="68" fill="#8b949e" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">NVIDIA L4 · CUDA events · lower mean latency is better</text>

  <g stroke="#30363d" stroke-width="1">
    <line x1="205" y1="88" x2="205" y2="446"/>
    <line x1="330" y1="88" x2="330" y2="446"/>
    <line x1="455" y1="88" x2="455" y2="446"/>
    <line x1="580" y1="88" x2="580" y2="446"/>
    <line x1="705" y1="88" x2="705" y2="446"/>
    <line x1="767" y1="88" x2="767" y2="446"/>
  </g>
  <g fill="#8b949e" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12" text-anchor="middle">
    <text x="205" y="466">0x</text>
    <text x="330" y="466">1x</text>
    <text x="455" y="466">2x</text>
    <text x="580" y="466">3x</text>
    <text x="705" y="466">4x</text>
    <text x="767" y="466">4.5x</text>
  </g>
  <line x1="330" y1="88" x2="330" y2="446" stroke="#f85149" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="334" y="102" fill="#f85149" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">PyTorch parity</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
    <text x="190" y="123" fill="#c9d1d9" text-anchor="end">q15 · d1 · FP16</text>
    <rect x="205" y="109" width="276.9" height="18" rx="4" fill="#2f81f7"/>
    <text x="490" y="123" fill="#f0f6fc">2.21x</text>

    <text x="190" y="151" fill="#c9d1d9" text-anchor="end">q15 · d1 · BF16</text>
    <rect x="205" y="137" width="278.0" height="18" rx="4" fill="#a371f7"/>
    <text x="491" y="151" fill="#f0f6fc">2.22x</text>

    <text x="190" y="179" fill="#c9d1d9" text-anchor="end">q15 · d8 · FP16</text>
    <rect x="205" y="165" width="286.0" height="18" rx="4" fill="#2f81f7"/>
    <text x="499" y="179" fill="#f0f6fc">2.29x</text>

    <text x="190" y="207" fill="#c9d1d9" text-anchor="end">q15 · d8 · BF16</text>
    <rect x="205" y="193" width="284.5" height="18" rx="4" fill="#a371f7"/>
    <text x="498" y="207" fill="#f0f6fc">2.28x</text>

    <text x="190" y="235" fill="#c9d1d9" text-anchor="end">q15 · d32 · FP16</text>
    <rect x="205" y="221" width="296.5" height="18" rx="4" fill="#2f81f7"/>
    <text x="510" y="235" fill="#f0f6fc">2.37x</text>

    <text x="190" y="263" fill="#c9d1d9" text-anchor="end">q15 · d32 · BF16</text>
    <rect x="205" y="249" width="291.1" height="18" rx="4" fill="#a371f7"/>
    <text x="504" y="263" fill="#f0f6fc">2.33x</text>

    <text x="190" y="291" fill="#c9d1d9" text-anchor="end">q15 · d128 · FP16</text>
    <rect x="205" y="277" width="528.1" height="18" rx="4" fill="#2f81f7"/>
    <text x="741" y="291" fill="#f0f6fc">4.22x</text>

    <text x="190" y="319" fill="#c9d1d9" text-anchor="end">q15 · d128 · BF16</text>
    <rect x="205" y="305" width="539.2" height="18" rx="4" fill="#a371f7"/>
    <text x="752" y="319" fill="#f0f6fc">4.31x</text>

    <text x="190" y="347" fill="#c9d1d9" text-anchor="end">padded q32 · d64 · FP16</text>
    <rect x="205" y="333" width="202.4" height="18" rx="4" fill="#2f81f7"/>
    <text x="415" y="347" fill="#f0f6fc">1.62x</text>

    <text x="190" y="375" fill="#c9d1d9" text-anchor="end">padded q32 · d64 · BF16</text>
    <rect x="205" y="361" width="196.3" height="18" rx="4" fill="#a371f7"/>
    <text x="409" y="375" fill="#f0f6fc">1.57x</text>

    <text x="190" y="403" fill="#c9d1d9" text-anchor="end">long q50 · d32 · FP16</text>
    <rect x="205" y="389" width="199.5" height="18" rx="4" fill="#2f81f7"/>
    <text x="412" y="403" fill="#f0f6fc">1.60x</text>

    <text x="190" y="431" fill="#c9d1d9" text-anchor="end">long q50 · d32 · BF16</text>
    <rect x="205" y="417" width="223.0" height="18" rx="4" fill="#a371f7"/>
    <text x="436" y="431" fill="#f0f6fc">1.78x</text>
  </g>

  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12">
    <rect x="36" y="476" width="14" height="14" rx="3" fill="#2f81f7"/>
    <text x="57" y="488" fill="#c9d1d9">FP16</text>
    <rect x="103" y="476" width="14" height="14" rx="3" fill="#a371f7"/>
    <text x="124" y="488" fill="#c9d1d9">BF16</text>
    <text x="820" y="488" fill="#8b949e" text-anchor="end">12/12 Triton wins · 2.27x geometric mean</text>
  </g>
</svg>
