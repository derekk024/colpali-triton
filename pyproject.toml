[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colpali-triton"
version = "1.0.0"
description = "A reproducible ColPali retrieval study with a GPU-optimized Triton MaxSim kernel"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Derek (derekk024)" },
]
keywords = [
    "colpali",
    "document-retrieval",
    "triton",
    "cuda",
    "maxsim",
    "late-interaction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "rank-bm25==0.2.2",
]
evaluation = [
    "fsspec[http]==2025.2.0",
    "pyarrow==21.0.0",
    "sentence-transformers==3.0.1",
    "transformers>=4.41.1,<4.43",
]
multimodal = [
    "accelerate==0.31.0",
    "huggingface-hub==0.36.2",
    "peft==0.11.1",
    "Pillow==10.4.0",
    "safetensors==0.7.0",
    "tokenizers==0.19.1",
    "torchvision==0.21.0",
    "transformers==4.42.4",
]

[project.urls]
Homepage = "https://github.com/derekk024/colpali-triton"
Repository = "https://github.com/derekk024/colpali-triton"
Documentation = "https://github.com/derekk024/colpali-triton/blob/main/reports/phase_12_final_report.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "mps: exercises the Apple Metal backend when it is available",
]
